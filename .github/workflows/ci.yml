name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-with-at-least-32-characters
      IMAGE_PROXY_SIGNING_SECRET: ci-image-proxy-signing-secret-with-at-least-32-characters
      RESEND_API_KEY: re_ci_build_placeholder
      RESEND_FROM_EMAIL: noreply@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Run offline exact-SHA release gate contract test
        run: bash scripts/require-github-ci-success.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  production-payment-recovery-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: production_payment_recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d production_payment_recovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the required native payment-recovery concurrency suite
        env:
          PRODUCTION_PAYMENT_RECOVERY_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/production_payment_recovery_test
          PRODUCTION_PAYMENT_RECOVERY_POSTGRES_TEST_MARKER: local-ephemeral-production-payment-recovery-only
          PRODUCTION_PAYMENT_RECOVERY_POSTGRES_TEST_REQUIRED: 'true'
        run: >-
          npx vitest run
          lib/services/analysis/production-payment-recovery-postgres-concurrency.integration.test.ts

  score-audit-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: score_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d score_audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run actual migration concurrency test
        env:
          SCORE_AUDIT_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/score_audit_test
        run: >-
          npx vitest run
          lib/services/analysis/score-audit-postgres-concurrency.test.ts

  revenue-settlement-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revenue_settlement_lock_order_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revenue_settlement_lock_order_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run effective revenue-settlement PostgreSQL chain
        env:
          REVENUE_SETTLEMENT_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/revenue_settlement_lock_order_test
          REVENUE_SETTLEMENT_POSTGRES_TEST_MARKER: local-ephemeral-revenue-settlement-lock-order-only
        run: >-
          npx vitest run
          lib/services/analysis/revenue-settlement-readiness-postgres-concurrency.integration.test.ts

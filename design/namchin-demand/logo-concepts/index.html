<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>남친 맞팔 알리미 | 캐릭터 로고 시안</title>
    <link rel="stylesheet" href="./board.css">
  </head>
  <body>
    <main>
      <header>
        <a href="/">← 랜딩페이지</a>
        <p class="brand">남친 맞팔 알리미</p>
        <h1>캐릭터 로고 시안</h1>
        <p>같은 캐릭터를 크게 보고, 32px 아이콘에서도 비교해 보세요.</p>
      </header>
      <div class="concepts">
        <article>
          <figure><img src="./a-bell.png" alt="둥근 얼굴과 진동 표시가 있는 살구색 알림 종"></figure>
          <div class="concept-caption"><div><h2>A. 알림 종</h2><p>랜딩의 종을 웃는 캐릭터로.</p></div><div class="mini" aria-label="32픽셀 미리보기"><img src="./a-bell.png" alt="" width="32" height="32"></div></div>
        </article>
        <article>
          <figure><img src="./b-links.png" alt="서로 맞물린 두 주황색 캐릭터"></figure>
          <div class="concept-caption"><div><h2>B. 맞팔 짝꿍</h2><p>서로 맞물리는 두 캐릭터로 맞팔을 표현.</p></div><div class="mini" aria-label="32픽셀 미리보기"><img src="./b-links.png" alt="" width="32" height="32"></div></div>
        </article>
        <article>
          <figure><img src="./c-bird.png" alt="말풍선 꼬리와 접힌 날개를 가진 살구색 새"></figure>
          <div class="concept-caption"><div><h2>C. 소식 배달새</h2><p>말풍선 꼬리를 달고 소식을 전하는 새.</p></div><div class="mini" aria-label="32픽셀 미리보기"><img src="./c-bird.png" alt="" width="32" height="32"></div></div>
        </article>
        <article>
          <figure><img src="./d-envelope.png" alt="알림 점이 찍힌 웃는 주황색 봉투"></figure>
          <div class="concept-caption"><div><h2>D. 알림 봉투</h2><p>새 메시지 알림 점을 단 웃는 봉투.</p></div><div class="mini" aria-label="32픽셀 미리보기"><img src="./d-envelope.png" alt="" width="32" height="32"></div></div>
        </article>
      </div>
    </main>
  </body>
</html>

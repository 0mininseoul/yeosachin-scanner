<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>프라이빗 오픈 시안 A</title>
    <link rel="icon" href="/namchin/logo.png" type="image/png">
    <link rel="stylesheet" href="/namchin/landing.css">
    <link rel="stylesheet" href="/private-concepts/concepts.css">
  </head>
  <body class="concept-page">
    <section class="missed shell" aria-labelledby="missed-title">
      <div class="missed-copy">
        <p class="overline">프라이빗 오픈</p>
        <h2 id="missed-title">이 서비스는 사전예약하는<br><em><span>300</span>명에게만 먼저 제공돼요</em></h2>
        <p>체리는 선착순 300명에게만 먼저 열려요. 등록하지 않으면 남친이 누구랑 맞팔하든 모르고 지나가요.</p>
      </div>
      <div class="reveal">
        <p class="reveal-title">남친이 방금 맞팔한 사람</p>
        <div class="reveal-stage">
          <img class="reveal-photo" src="/namchin/assets/hero/seoa-profile.jpg" width="1080" height="1080" alt="">
          <img class="reveal-photo reveal-photo--hidden" src="/namchin/assets/hero/seoa-profile.jpg" width="1080" height="1080" alt="">
          <span class="reveal-line"></span>
          <p class="reveal-id reveal-id--in"><b>@seoa.ondo_</b><span>박서아</span></p>
          <p class="reveal-id reveal-id--out"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7.5a5 5 0 0 1 10 0V10"/><rect x="4.5" y="10" width="15" height="11" rx="3"/></svg><span>누군지 모름</span></p>
        </div>
        <div class="reveal-captions">
          <p class="is-in"><b>사전예약 300명</b><span>누군지 바로 알아요.</span></p>
          <p><b>등록 안 한 사람</b><span>계속 모르고 지나가요.</span></p>
        </div>
      </div>
    </section>
  </body>
</html>

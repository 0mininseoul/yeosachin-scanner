<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>프라이빗 오픈 시안 B</title>
    <link rel="icon" href="/cherry/logo.png" type="image/png">
    <link rel="stylesheet" href="/cherry/landing.css">
    <link rel="stylesheet" href="/private-concepts/concepts.css">
  </head>
  <body class="concept-page">
    <section class="missed shell" aria-labelledby="missed-title">
      <div class="missed-copy">
        <p class="overline">프라이빗 오픈</p>
        <h2 id="missed-title">이 서비스는 사전예약하는<br><em><span>300</span>명에게만 먼저 제공돼요</em></h2>
        <p>체리는 선착순 300명에게만 먼저 열려요. 등록하지 않으면 남친이 누구랑 맞팔하든 모르고 지나가요.</p>
      </div>
      <div class="seats">
        <div class="seats-room">
          <p class="seats-head"><span>프라이빗 오픈</span><b><i>300</i>자리</b></p>
          <div class="seats-grid"><span class="seat-mine"><img src="/cherry/logo.png" width="34" height="34" alt=""></span><p class="seat-label">내 자리</p></div>
          <p class="seats-note"><b>사전예약 300명</b><span>맞팔하자마자 카톡이 와요.</span></p>
        </div>
        <div class="seats-out">
          <div class="seats-crowd"></div>
          <p class="seats-note"><b>등록 안 한 사람</b><span>계속 모르고 지나가요.</span></p>
        </div>
      </div>
    </section>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>프라이빗 오픈 시안 C</title>
    <link rel="icon" href="/cherry/logo.png" type="image/png">
    <link rel="stylesheet" href="/cherry/landing.css">
    <link rel="stylesheet" href="/private-concepts/concepts.css">
  </head>
  <body class="concept-page">
    <section class="missed shell" aria-labelledby="missed-title">
      <div class="missed-copy">
        <p class="overline">프라이빗 오픈</p>
        <h2 id="missed-title">이 서비스는 사전예약하는<br><em><span>300</span>명에게만 먼저 제공돼요</em></h2>
        <p>체리는 선착순 300명에게만 먼저 열려요. 등록하지 않으면 남친이 누구랑 맞팔하든 모르고 지나가요.</p>
      </div>
      <div class="lanes">
        <p class="lanes-start"><img src="/cherry/assets/hero/maru-profile.jpg" width="40" height="40" alt=""><span>남친이 새로 맞팔했어요</span><b>+1</b></p>
        <div class="lanes-body">
          <div class="lane lane--in">
            <p class="lane-name">사전예약 300명</p>
            <ol>
              <li><span>맞팔하자마자</span><b class="lane-push"><img src="/cherry/assets/kakao-symbol.svg" width="24" height="24" alt="">카톡 도착</b></li>
              <li><span>알림을 열면</span><b class="lane-who"><img src="/cherry/assets/hero/seoa-profile.jpg" width="30" height="30" alt="">박서아</b></li>
              <li><span>그날 바로</span><b class="lane-done"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>알고 있음</b></li>
            </ol>
          </div>
          <div class="lane lane--out">
            <p class="lane-name">등록 안 한 사람</p>
            <ol>
              <li><span>그날</span><b>모름</b></li>
              <li><span>일주일 뒤</span><b>모름</b></li>
              <li><span>한 달 뒤</span><b>아직도 모름</b></li>
            </ol>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
